[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "promisekeeper"
version = "0.1.0"
description = "Fictional payment-case evidence and deterministic domain rules"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "openai>=2,<3",
  "tzdata>=2024.2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "jsonschema>=4.23,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/promisekeeper"]
